<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixelfunz — A D&D-Style Pixel RPG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1423;
    color: #e8d8b0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
  h1 { color: #f0c060; text-shadow: 2px 2px #402810; letter-spacing: 3px; margin: 8px 0; }
  #game-wrap { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #6b4a2a;
    background: #000;
    outline: none;
    box-sizing: content-box;
  }
  #side {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel {
    border: 3px solid #6b4a2a;
    background: #241a2e;
    padding: 8px;
    font-size: 13px;
  }
  .panel h3 { color: #f0c060; font-size: 13px; margin-bottom: 4px; border-bottom: 1px solid #6b4a2a; }
  #log {
    height: 220px;
    overflow-y: auto;
    line-height: 1.5;
  }
  #log .roll { color: #8fd0ff; }
  #log .dmg { color: #ff8f8f; }
  #log .good { color: #9fe89f; }
  #log .crit { color: #ffd700; font-weight: bold; }
  #log .sys { color: #b09fd0; }
  .bar { background: #402030; height: 12px; border: 1px solid #6b4a2a; margin: 2px 0 6px; }
  .bar > div { height: 100%; transition: width 0.3s; }
  #hpbar > div { background: linear-gradient(#e05050, #a02020); }
  #xpbar > div { background: linear-gradient(#50a0e0, #204880); }
  #controls { font-size: 11px; color: #a08868; }
  kbd { background: #402810; padding: 0 4px; border-radius: 3px; color: #f0c060; }
  /* Touch controls: shown only on touch (coarse-pointer) devices */
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 480px;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #touch-controls button {
    background: #241a2e;
    border: 3px solid #6b4a2a;
    color: #f0c060;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    border-radius: 6px;
    touch-action: manipulation;
  }
  #touch-controls button:active { background: #402810; }
  #dpad {
    display: grid;
    grid-template-areas: ". up ." "left . right" ". down .";
    gap: 4px;
  }
  #dpad button { width: 52px; height: 52px; }
  #action-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    max-width: 200px;
  }
  #action-buttons button { min-width: 58px; height: 44px; font-size: 13px; }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>
<h1 aria-label="Pixelfunz">&#9876; PIXELFUNZ &#9876;</h1>
<div id="game-wrap">
  <canvas id="c" width="480" height="480" tabindex="0"></canvas>
  <div id="touch-controls" aria-label="Touch controls">
    <div id="dpad">
      <button type="button" data-key="ArrowUp" aria-label="Climb up" style="grid-area: up;">&#9650;</button>
      <button type="button" data-key="ArrowLeft" aria-label="Move left" style="grid-area: left;">&#9664;</button>
      <button type="button" data-key="ArrowRight" aria-label="Move right" style="grid-area: right;">&#9654;</button>
      <button type="button" data-key="ArrowDown" aria-label="Climb down" style="grid-area: down;">&#9660;</button>
    </div>
    <div id="action-buttons">
      <button type="button" data-key="1" aria-label="Attack">&#9876; Atk</button>
      <button type="button" data-key="2" aria-label="Cast spell">&#10024; Spl</button>
      <button type="button" data-key="3" aria-label="Defend">&#128737; Def</button>
      <button type="button" data-key="4" aria-label="Flee">&#128168; Run</button>
      <button type="button" data-key="h" aria-label="Drink potion">&#129380; Pot</button>
      <button type="button" data-key="r" aria-label="Reroll stats">&#127922; Roll</button>
      <button type="button" data-key="Enter" aria-label="Confirm">&#9166; OK</button>
    </div>
  </div>
  <div id="side">
    <div class="panel" id="stats-panel">
      <h3 id="pname">Adventurer</h3>
      <div>HP: <span id="hptext"></span></div>
      <div class="bar" id="hpbar"><div></div></div>
      <div>XP: <span id="xptext"></span></div>
      <div class="bar" id="xpbar"><div></div></div>
      <div id="statline"></div>
      <div id="invline"></div>
    </div>
    <div class="panel">
      <h3>Adventure Log</h3>
      <div id="log" aria-live="polite"></div>
    </div>
    <div class="panel" id="controls">
      <kbd>&#8592;&#8594;</kbd> walk &middot; <kbd>&#8593;&#8595;</kbd> climb &middot; <kbd>1-4</kbd> combat actions &middot; <kbd>Enter</kbd> confirm &middot; <kbd>H</kbd> drink potion
    </div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   PIXELFUNZ — a D&D-style pixel art RPG in a single file.
   Side-scrolling view: walk, climb, and swim across a rolling
   overworld and descend into cavernous dungeons.
   All art is drawn procedurally on canvas. No external assets.
   ============================================================ */

const TILE = 32, VIEW = 15;           // 15x15 tiles of 32px = 480px
const MOVE_MS = 140;                  // duration of the tile-to-tile walk animation
const COMBAT_DELAY_MS = 700;          // pause before the monster acts
const RANDOM_ENCOUNTER_CHANCE = 0.03; // per-step ambush chance in dungeons
const POTION_COST = 25, MAX_POTIONS = 5;
// Seeded LCG (glibc constants); masks to 2^31-1 and divides to yield [0, 1).
function makeLCG(seed) {
  let st = seed;
  return () => { st = (st * 1103515245 + 12345) & 0x7fffffff; return st / 0x7fffffff; };
}
// Tile type IDs (side view: grass/sand/dirt are solid ground blocks you stand on)
const T_GRASS = 0, T_TREE = 1, T_WATER = 2, T_MOUNTAIN = 3, T_FLOOR = 4,
      T_WALL = 5, T_SAND = 6, T_CAVE = 7, T_TOWN = 8, T_SKY = 9, T_DIRT = 10;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ---------- Dice ----------
function roll(sides) { return 1 + Math.floor(Math.random() * sides); }
function rollDice(n, sides, bonus = 0) {
  let t = bonus;
  for (let i = 0; i < n; i++) t += roll(sides);
  return t;
}
function mod(stat) { return Math.floor((stat - 10) / 2); }
function fmtMod(m) { return (m >= 0 ? "+" : "") + m; }
function roll4d6DropLowest() {
  const r = [roll(6), roll(6), roll(6), roll(6)].sort((a, b) => a - b);
  return r[1] + r[2] + r[3];
}

// ---------- Log ----------
const logEl = document.getElementById("log");
function log(msg, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
  while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------- Pixel sprite engine ----------
// Sprites are 16x16 grids of palette indices, scaled 2x to 32px.
const PAL = {
  ".": null,        // transparent
  "0": "#000000", "s": "#e8b888", "S": "#c08858", // skin
  "h": "#6b3a1a", "H": "#3a2410",                 // hair
  "r": "#c03030", "R": "#801818",                 // red
  "b": "#3858c0", "B": "#203070",                 // blue
  "g": "#38a048", "G": "#1f6030",                 // green
  "y": "#e8c840", "Y": "#a88820",                 // gold
  "w": "#e8e8e8", "W": "#a0a0b0",                 // white/steel
  "m": "#888898", "M": "#505060",                 // metal
  "p": "#9048c0", "P": "#582880",                 // purple
  "k": "#403040", "K": "#201828",                 // dark
  "n": "#8a6a3a", "N": "#5a4020",                 // brown
  "o": "#e88030", "O": "#a05010",                 // orange
  "e": "#c8e858", "E": "#7fa030",                 // sick green
  "f": "#ff6820", "F": "#c03000",                 // fire
  "q": "#d8d0c0", "Q": "#989080",                 // bone
};
function makeSprite(rows) {
  const off = document.createElement("canvas");
  off.width = 32; off.height = 32;
  const c = off.getContext("2d");
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const col = PAL[rows[y][x]];
      if (col) { c.fillStyle = col; c.fillRect(x * 2, y * 2, 2, 2); }
    }
  }
  return off;
}

const SPRITES = {};

// --- Hero sprites per class (fighter red, wizard purple, rogue dark, cleric white) ---
function heroSprite(a, A) { // a = tunic color, A = tunic shade
  return makeSprite([
    "................",
    ".....hhhhhh.....",
    "....hhhhhhhh....",
    "....hHssssHh....",
    "....ssssssss....",
    "....s0ss0sss....",
    "....sssssSss....",
    ".....ssSSs......",
    "...." + a + a + a + a + a + a + a + a + "....",
    "..s." + a + A + a + a + a + a + A + a + ".s..",
    "..ss" + a + a + a + a + a + a + a + a + "ss..",
    "...." + A + a + a + a + a + a + a + A + "....",
    ".....NNyyNN.....",
    ".....NN....NN...",
    ".....NN....NN...",
    "....000....000..",
  ]);
}
SPRITES.fighter = heroSprite("r", "R");
SPRITES.wizard  = heroSprite("p", "P");
SPRITES.rogue   = heroSprite("k", "K");
SPRITES.cleric  = heroSprite("w", "W");

SPRITES.goblin = makeSprite([
  "................",
  "................",
  "..g..........g..",
  "..gg.gggggg.gg..",
  "..ggggggggggg...",
  "...gggggggggg...",
  "...g0gggg0gg....",
  "...gggggggg.....",
  "....ggrwgg......",
  "....kkkkkkkk....",
  "..g.kKkkkkKk.g..",
  "..ggkkkkkkkkgg..",
  "....kkkkkkkk....",
  ".....gg..gg.....",
  ".....gg..gg.....",
  "....000..000....",
]);
SPRITES.skeleton = makeSprite([
  "................",
  "....qqqqqqqq....",
  "....qqqqqqqq....",
  "....q0qqqq0q....",
  "....qqqqqqqq....",
  ".....q0000q.....",
  "......qqqq......",
  "....qqqqqqqq....",
  "..q..qQQQQq..q..",
  "..qq.qqqqqq.qq..",
  ".....qQQQQq.....",
  "......qqqq......",
  ".....qQ..Qq.....",
  ".....qq..qq.....",
  ".....qq..qq.....",
  "....000..000....",
]);
SPRITES.orc = makeSprite([
  "................",
  "...EEEEEEEEEE...",
  "..EEEEEEEEEEEE..",
  "..EE0EEEEE0EEE..",
  "..EEEEEEEEEEEE..",
  "...EEwEEEEwE....",
  "...EEEEEEEEE....",
  "....mmmmmmmm....",
  "..E.mMmmmmMm.E..",
  "..EEmmmmmmmmEE..",
  "..E.mmmmmmmm.E..",
  "....MmmmmmmM....",
  ".....EE..EE.....",
  ".....EE..EE.....",
  "....NNN..NNN....",
  "....000..000....",
]);
SPRITES.wolf = makeSprite([
  "................",
  "................",
  "................",
  "..M..........M..",
  "..MM........MM..",
  "..MMMMMMMMMMM...",
  ".MM0MMMMMMMMMM..",
  ".MMMMMMMMMMMMM..",
  "..MwwMMMMMMMM...",
  "...MMMMMMMMMM...",
  "....MM.MM.MM....",
  "....MM.MM.MM....",
  "....00.00.00....",
  "................",
  "................",
  "................",
]);
SPRITES.dragon = makeSprite([
  "....R......R....",
  "...RR......RR...",
  "..RRRRRRRRRRRR..",
  ".RRrrrrrrrrrrRR.",
  ".Rrr0rrrr0rrrR..",
  "..rrrrrrrrrrr...",
  "..rrfFFffFFrr...",
  "...rrrrrrrrr....",
  "..RrrrrrrrrrR...",
  ".RRrrrYYrrrrRR..",
  ".R.rrrYYrrrr.R..",
  "...rrrrrrrrr....",
  "....rrrrrr......",
  "....rr..rr......",
  "...RRR..RRR.....",
  "...000..000.....",
]);
SPRITES.chest = makeSprite([
  "................",
  "................",
  "................",
  "....nnnnnnnn....",
  "...nNNNNNNNNn...",
  "...nnnnnnnnnn...",
  "...nNNNyyNNNn...",
  "...nnnnyynnnn...",
  "...nNNNNNNNNn...",
  "...nnnnnnnnnn...",
  "...nNNNNNNNNn...",
  "...nnnnnnnnnn...",
  "....00000000....",
  "................",
  "................",
  "................",
]);
SPRITES.stairs = makeSprite([
  "0000000000000000",
  "0kkkkkkkkkkkkkk0",
  "0kKKKKKKKKKKKk00",
  "0kK..........000",
  "0kK.KKKKKKK..000",
  "0kK.K........000",
  "0kK.K.KKKK...000",
  "0kK.K.K......000",
  "0kK.K.K.KK...000",
  "0kK.K.K.K....000",
  "0kK.K.K.K.K..000",
  "0kK..........000",
  "0kKKKKKKKKKKK000",
  "0k00000000000000",
  "0000000000000000",
  "0000000000000000",
]);

// --- Tiles drawn procedurally (deterministic noise) ---
// Deterministic 2D hash noise: large odd multiplicative constants + xorshift
// mixing produce a uniform pseudo-random value in [0, 1) for a given cell/seed.
// Unsigned shifts keep the sign bit in play so the full range is covered.
function hashNoise(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
  h = ((h ^ (h >>> 13)) * 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function drawTile(type, sx, sy, wx, wy) {
  switch (type) {
    case T_GRASS: { // grass-topped ground block (side view)
      ctx.fillStyle = "#7a5230";
      ctx.fillRect(sx, sy, TILE, TILE);
      for (let i = 0; i < 5; i++) { // dirt speckles
        ctx.fillStyle = hashNoise(wx, wy, i + 50) > 0.5 ? "#8a6038" : "#6a4628";
        ctx.fillRect(sx + ((hashNoise(wx, wy, i) * 14) | 0) * 2, sy + 10 + ((hashNoise(wx, wy, i + 10) * 10) | 0) * 2, 4, 2);
      }
      // grass cap
      ctx.fillStyle = "#2f7a38";
      ctx.fillRect(sx, sy, TILE, 8);
      ctx.fillStyle = "#3a8f44";
      ctx.fillRect(sx, sy, TILE, 3);
      // grass blades poking up along the surface
      for (let i = 0; i < 4; i++) {
        const bx = sx + ((hashNoise(wx, wy, i + 60) * 15) | 0) * 2;
        ctx.fillStyle = hashNoise(wx, wy, i + 65) > 0.5 ? "#4aa050" : "#276830";
        ctx.fillRect(bx, sy, 2, 4 + ((hashNoise(wx, wy, i + 70) * 3) | 0) * 2);
      }
      // ragged grass-to-dirt edge
      for (let i = 0; i < 4; i++) {
        if (hashNoise(wx, wy, i + 75) > 0.5) {
          ctx.fillStyle = "#2f7a38";
          ctx.fillRect(sx + i * 8 + 2, sy + 8, 4, 2);
        }
      }
      break;
    }
    case T_TREE: { // tree standing on the ground below (sky behind)
      drawTile(T_SKY, sx, sy, wx, wy);
      // trunk with bark shading
      ctx.fillStyle = "#5a4020";
      ctx.fillRect(sx + 12, sy + 20, 8, 12);
      ctx.fillStyle = "#3e2a12";
      ctx.fillRect(sx + 17, sy + 20, 3, 12);
      ctx.fillStyle = "#6e5228";
      ctx.fillRect(sx + 12, sy + 20, 2, 12);
      // layered canopy: dark base, mid tone, sunlit top
      ctx.fillStyle = "#1c5228";
      ctx.fillRect(sx + 4, sy + 4, 24, 18);
      ctx.fillStyle = "#256b34";
      ctx.fillRect(sx + 8, sy + 2, 16, 8);
      ctx.fillRect(sx + 6, sy + 8, 8, 8);
      ctx.fillStyle = "#2f8040";
      ctx.fillRect(sx + 10, sy + 4, 8, 4);
      ctx.fillRect(sx + 8, sy + 10, 4, 4);
      // deterministic leaf speckles
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = hashNoise(wx, wy, i + 90) > 0.5 ? "#38914a" : "#154020";
        ctx.fillRect(sx + 6 + ((hashNoise(wx, wy, i + 95) * 10) | 0) * 2,
                     sy + 5 + ((hashNoise(wx, wy, i + 100) * 7) | 0) * 2, 2, 2);
      }
      break;
    }
    case T_WATER: { // water
      // deep-to-shallow banding for a sense of depth
      ctx.fillStyle = "#1e4a8a";
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#183e78";
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(sx + ((hashNoise(wx, wy, i + 30) * 12) | 0) * 2,
                     sy + ((hashNoise(wx, wy, i + 40) * 12) | 0) * 2, 10, 4);
      }
      const ph = (Date.now() / 600 + wx + wy) | 0;
      for (let i = 0; i < 4; i++) {
        const n = hashNoise(wx, wy, i + ph % 3);
        ctx.fillStyle = "#3a6ab0";
        ctx.fillRect(sx + ((n * 12) | 0) * 2, sy + ((hashNoise(wx, wy, i + 9) * 14) | 0) * 2, 8, 2);
      }
      // animated glints riding the wave crests
      for (let i = 0; i < 2; i++) {
        const n = hashNoise(wx, wy, i + 5 + ph % 3);
        ctx.fillStyle = "#7ea8d8";
        ctx.fillRect(sx + ((n * 13) | 0) * 2, sy + ((hashNoise(wx, wy, i + 15) * 14) | 0) * 2, 4, 2);
      }
      break;
    }
    case T_MOUNTAIN: { // solid rock block
      ctx.fillStyle = "#5a5a66";
      ctx.fillRect(sx, sy, TILE, TILE);
      // chunky stone facets
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = hashNoise(wx, wy, i + 110) > 0.5 ? "#6a6a78" : "#4c4c58";
        ctx.fillRect(sx + ((hashNoise(wx, wy, i + 115) * 12) | 0) * 2,
                     sy + ((hashNoise(wx, wy, i + 120) * 12) | 0) * 2, 8, 6);
      }
      // crevice lines
      ctx.fillStyle = "#3e3e48";
      if (hashNoise(wx, wy, 125) > 0.5) {
        ctx.fillRect(sx + ((hashNoise(wx, wy, 126) * 12) | 0) * 2 + 2, sy + 4, 2, 12);
        ctx.fillRect(sx + ((hashNoise(wx, wy, 126) * 12) | 0) * 2 + 4, sy + 16, 2, 8);
      }
      // top-edge highlight
      ctx.fillStyle = "#78788a";
      ctx.fillRect(sx, sy, TILE, 3);
      break;
    }
    case T_FLOOR: { // dungeon cavern air (carved-out space)
      ctx.fillStyle = "#3a3242";
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#443a4e";
      if (hashNoise(wx, wy, 3) > 0.6) ctx.fillRect(sx + 8, sy + 8, 6, 6);
      // cracks and pebbles worn into the flagstones
      const cn = hashNoise(wx, wy, 130);
      if (cn > 0.7) {
        ctx.fillStyle = "#2a2432";
        const cx2 = sx + ((hashNoise(wx, wy, 131) * 10) | 0) * 2 + 4;
        const cy2 = sy + ((hashNoise(wx, wy, 132) * 10) | 0) * 2 + 4;
        ctx.fillRect(cx2, cy2, 6, 2);
        ctx.fillRect(cx2 + 4, cy2 + 2, 2, 4);
      }
      if (hashNoise(wx, wy, 135) > 0.75) {
        ctx.fillStyle = "#4e4458";
        ctx.fillRect(sx + ((hashNoise(wx, wy, 136) * 13) | 0) * 2,
                     sy + ((hashNoise(wx, wy, 137) * 13) | 0) * 2, 2, 2);
      }
      ctx.strokeStyle = "#2a2432";
      ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
      break;
    }
    case T_WALL: { // dungeon wall
      ctx.fillStyle = "#1a1422";
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#2e2438";
      ctx.fillRect(sx + 1, sy + 1, 14, 6); ctx.fillRect(sx + 17, sy + 1, 14, 6);
      ctx.fillRect(sx + 1, sy + 9, 6, 6); ctx.fillRect(sx + 9, sy + 9, 22, 6);
      ctx.fillRect(sx + 1, sy + 17, 14, 6); ctx.fillRect(sx + 17, sy + 17, 14, 6);
      ctx.fillRect(sx + 1, sy + 25, 6, 6); ctx.fillRect(sx + 9, sy + 25, 22, 6);
      // top-edge highlight on each brick to catch torchlight
      ctx.fillStyle = "#3a2e48";
      ctx.fillRect(sx + 1, sy + 1, 14, 2); ctx.fillRect(sx + 17, sy + 1, 14, 2);
      ctx.fillRect(sx + 1, sy + 9, 6, 2); ctx.fillRect(sx + 9, sy + 9, 22, 2);
      ctx.fillRect(sx + 1, sy + 17, 14, 2); ctx.fillRect(sx + 17, sy + 17, 14, 2);
      ctx.fillRect(sx + 1, sy + 25, 6, 2); ctx.fillRect(sx + 9, sy + 25, 22, 2);
      // deterministic chips and moss on some bricks
      if (hashNoise(wx, wy, 140) > 0.65) {
        ctx.fillStyle = "#241c2c";
        ctx.fillRect(sx + ((hashNoise(wx, wy, 141) * 12) | 0) * 2 + 2,
                     sy + ((hashNoise(wx, wy, 142) * 3) | 0) * 8 + 3, 4, 2);
      }
      if (hashNoise(wx, wy, 145) > 0.85) {
        ctx.fillStyle = "#2c4030";
        ctx.fillRect(sx + ((hashNoise(wx, wy, 146) * 12) | 0) * 2 + 2,
                     sy + ((hashNoise(wx, wy, 147) * 3) | 0) * 8 + 4, 4, 2);
      }
      break;
    }
    case T_SAND: { // sand/path
      ctx.fillStyle = "#c8a860";
      ctx.fillRect(sx, sy, TILE, TILE);
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = "#b89850";
        ctx.fillRect(sx + ((hashNoise(wx, wy, i) * 14) | 0) * 2, sy + ((hashNoise(wx, wy, i + 20) * 14) | 0) * 2, 4, 2);
      }
      // lighter wind-blown grains and the odd pebble
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = "#d8bc78";
        ctx.fillRect(sx + ((hashNoise(wx, wy, i + 150) * 14) | 0) * 2,
                     sy + ((hashNoise(wx, wy, i + 155) * 14) | 0) * 2, 2, 2);
      }
      if (hashNoise(wx, wy, 160) > 0.8) {
        ctx.fillStyle = "#907840";
        ctx.fillRect(sx + ((hashNoise(wx, wy, 161) * 12) | 0) * 2 + 2,
                     sy + ((hashNoise(wx, wy, 162) * 12) | 0) * 2 + 2, 4, 4);
        ctx.fillStyle = "#a88c50";
        ctx.fillRect(sx + ((hashNoise(wx, wy, 161) * 12) | 0) * 2 + 2,
                     sy + ((hashNoise(wx, wy, 162) * 12) | 0) * 2 + 2, 4, 2);
      }
      break;
    }
    case T_CAVE: { // dungeon entrance: rocky mound with a dark opening (sky behind)
      drawTile(T_SKY, sx, sy, wx, wy);
      ctx.fillStyle = "#5a5a66";
      ctx.beginPath();
      ctx.moveTo(sx, sy + 32); ctx.lineTo(sx + 6, sy + 8); ctx.lineTo(sx + 16, sy + 2);
      ctx.lineTo(sx + 26, sy + 8); ctx.lineTo(sx + 32, sy + 32);
      ctx.fill();
      ctx.fillStyle = "#6a6a78";
      ctx.fillRect(sx + 10, sy + 4, 12, 4);
      ctx.fillRect(sx + 6, sy + 10, 6, 4);
      // rocky rim framing the opening
      ctx.fillStyle = "#8a8a9a";
      ctx.fillRect(sx + 8, sy + 12, 16, 2);
      ctx.fillRect(sx + 8, sy + 14, 2, 18);
      ctx.fillRect(sx + 22, sy + 14, 2, 18);
      ctx.fillStyle = "#000";
      ctx.fillRect(sx + 10, sy + 14, 12, 18);
      ctx.fillRect(sx + 12, sy + 10, 8, 6);
      // faint inner gloom so the entrance reads as deep
      ctx.fillStyle = "#181820";
      ctx.fillRect(sx + 10, sy + 14, 12, 2);
      break;
    }
    case T_TOWN: { // town house standing on the ground below (sky behind)
      drawTile(T_SKY, sx, sy, wx, wy);
      // roof with shaded underside and ridge highlight
      ctx.fillStyle = "#a04030";
      ctx.beginPath();
      ctx.moveTo(sx + 2, sy + 14); ctx.lineTo(sx + 16, sy + 2); ctx.lineTo(sx + 30, sy + 14);
      ctx.fill();
      ctx.fillStyle = "#c05840";
      ctx.beginPath();
      ctx.moveTo(sx + 8, sy + 9); ctx.lineTo(sx + 16, sy + 2); ctx.lineTo(sx + 24, sy + 9);
      ctx.fill();
      ctx.fillStyle = "#802818";
      ctx.fillRect(sx + 2, sy + 12, 28, 2);
      // chimney
      ctx.fillStyle = "#706068";
      ctx.fillRect(sx + 22, sy + 3, 4, 7);
      // walls with timber framing, door, and lit window
      ctx.fillStyle = "#c8a870";
      ctx.fillRect(sx + 6, sy + 14, 20, 18);
      ctx.fillStyle = "#8a6a3a";
      ctx.fillRect(sx + 6, sy + 14, 20, 1);
      ctx.fillRect(sx + 6, sy + 14, 1, 18);
      ctx.fillRect(sx + 25, sy + 14, 1, 18);
      ctx.fillStyle = "#503820";
      ctx.fillRect(sx + 13, sy + 20, 6, 12);
      ctx.fillStyle = "#e8c840";
      ctx.fillRect(sx + 17, sy + 26, 1, 1); // door handle
      ctx.fillStyle = "#f0d878";
      ctx.fillRect(sx + 21, sy + 18, 3, 3); // warm window glow
      break;
    }
    case T_SKY: { // open sky with drifting cloud wisps
      ctx.fillStyle = "#8ec4e8";
      ctx.fillRect(sx, sy, TILE, TILE);
      const cn = hashNoise(wx, wy, 170);
      if (cn > 0.82) {
        const cx2 = sx + ((hashNoise(wx, wy, 171) * 8) | 0) * 2;
        const cy2 = sy + ((hashNoise(wx, wy, 172) * 10) | 0) * 2;
        ctx.fillStyle = "#e8f2fa";
        ctx.fillRect(cx2, cy2 + 2, 16, 4);
        ctx.fillRect(cx2 + 4, cy2, 8, 2);
        ctx.fillStyle = "#c8dcee";
        ctx.fillRect(cx2, cy2 + 6, 16, 2);
      }
      break;
    }
    case T_DIRT: { // underground earth block
      ctx.fillStyle = "#6a4628";
      ctx.fillRect(sx, sy, TILE, TILE);
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = hashNoise(wx, wy, i + 180) > 0.5 ? "#7a5230" : "#583a20";
        ctx.fillRect(sx + ((hashNoise(wx, wy, i + 185) * 14) | 0) * 2,
                     sy + ((hashNoise(wx, wy, i + 190) * 14) | 0) * 2, 6, 4);
      }
      // the odd buried stone
      if (hashNoise(wx, wy, 195) > 0.8) {
        ctx.fillStyle = "#8a8a8a";
        ctx.fillRect(sx + ((hashNoise(wx, wy, 196) * 11) | 0) * 2 + 2,
                     sy + ((hashNoise(wx, wy, 197) * 11) | 0) * 2 + 2, 6, 4);
      }
      break;
    }
  }
}
// Side-view: ground blocks are solid; sky/water/carved space are passable.
const SOLID = { [T_GRASS]: true, [T_SAND]: true, [T_DIRT]: true, [T_MOUNTAIN]: true, [T_WALL]: true };
// Tiles that support standing on top of them (water lets you swim along its surface).
function supports(t) { return SOLID[t] || t === T_WATER; }

// ---------- Classes (D&D style) ----------
const CLASSES = {
  fighter: { name: "Fighter", hd: 10, weapon: "Longsword",  wDice: [1, 8],  atkStat: "str", ac: 16, prime: ["str", "con"] },
  rogue:   { name: "Rogue",   hd: 8,  weapon: "Dagger x2",  wDice: [2, 4],  atkStat: "dex", ac: 14, prime: ["dex", "cha"] },
  wizard:  { name: "Wizard",  hd: 6,  weapon: "Fire Bolt",  wDice: [1, 10], atkStat: "int", ac: 12, prime: ["int", "wis"] },
  cleric:  { name: "Cleric",  hd: 8,  weapon: "Mace",       wDice: [1, 6],  atkStat: "wis", ac: 15, prime: ["wis", "con"] },
};

// ---------- Monsters ----------
const MONSTERS = {
  goblin:   { name: "Goblin",        spr: "goblin",   hp: [3, 6, 3],   ac: 13, atk: 4, dmg: [1, 4, 1],  xp: 50,  cr: 1 },
  wolf:     { name: "Dire Wolf",     spr: "wolf",     hp: [4, 8, 4],   ac: 13, atk: 5, dmg: [1, 6, 1],  xp: 90,  cr: 2 },
  skeleton: { name: "Skeleton",      spr: "skeleton", hp: [3, 8, 4],   ac: 13, atk: 4, dmg: [1, 4, 1],  xp: 70,  cr: 1 },
  orc:      { name: "Orc Warrior",   spr: "orc",      hp: [5, 8, 8],   ac: 14, atk: 6, dmg: [1, 8, 2],  xp: 150, cr: 3 },
  dragon:   { name: "Young Dragon",  spr: "dragon",   hp: [10, 10, 20],ac: 17, atk: 8, dmg: [2, 8, 3],  xp: 600, cr: 6, boss: true },
};

// ---------- World generation (side view) ----------
const MAP_W = 96, MAP_H = 48;
const GROUND_ROW = 30;    // flat surface: every column's ground sits on this row
const ROCK_DEPTH = 6;     // dirt turns to rock this far under the surface
function genOverworld(seed) {
  // Flat world: a single grass surface at GROUND_ROW with dirt/rock below.
  const hs = [];
  for (let x = 0; x < MAP_W; x++) hs.push(GROUND_ROW);
  const m = [];
  for (let y = 0; y < MAP_H; y++) {
    m.push([]);
    for (let x = 0; x < MAP_W; x++) {
      let t;
      if (x === 0 || x === MAP_W - 1) t = T_MOUNTAIN;          // world walls
      else if (y < GROUND_ROW) t = T_SKY;
      else if (y === GROUND_ROW) t = T_GRASS;
      else t = y - GROUND_ROW >= ROCK_DEPTH ? T_MOUNTAIN : T_DIRT;
      m[y].push(t);
    }
  }
  // Trees scattered on the grass.
  for (let x = 1; x < MAP_W - 1; x++) {
    if (hashNoise(x, 0, seed + 7) > 0.78) m[GROUND_ROW - 1][x] = T_TREE;
  }
  return { map: m, heights: hs };
}
function genDungeon(seed, level) {
  const m = [];
  for (let y = 0; y < MAP_H; y++) {
    m.push([]);
    for (let x = 0; x < MAP_W; x++) m[y].push(T_WALL);
  }
  // Dungeon-crawler layout: a flat floor at a single row, with tall rooms
  // joined by low corridors carved left to right across the level.
  const floorY = MAP_H >> 1; // row the player walks along
  const rnd = makeLCG(seed * 1000 + level);
  let x = 2, room = true;
  while (x < MAP_W - 2) {
    const w = room ? 6 + ((rnd() * 8) | 0) : 3 + ((rnd() * 5) | 0); // room / corridor width
    const h = room ? 4 + ((rnd() * 3) | 0) : 2;                      // room / corridor headroom
    const end = Math.min(x + w, MAP_W - 2);
    for (let cx = x; cx < end; cx++) {
      for (let cy = floorY; cy > floorY - h; cy--) m[cy][cx] = T_FLOOR;
    }
    x = end;
    room = !room;
  }
  // Standable spots: carved cells with solid footing, ordered left to right.
  const standable = [];
  for (let sy = 1; sy < MAP_H - 1; sy++) {
    for (let sx = 1; sx < MAP_W - 1; sx++) {
      if (m[sy][sx] === T_FLOOR && m[sy + 1][sx] === T_WALL) standable.push([sx, sy]);
    }
  }
  standable.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return { map: m, standable };
}

// ---------- Game state ----------
const G = {
  mode: "title",       // title | create | explore | combat | gameover | victory
  seed: (Math.random() * 100000) | 0,
  map: null,
  area: "overworld",   // overworld | dungeon1 | dungeon2 ...
  dungeonLevel: 0,
  px: 0, py: 0,
  face: 1,             // 1 = facing right, -1 = facing left
  moveAnim: null,      // {fx, fy, t0}: slide from (fx,fy) to (px,py) started at t0
  entities: [],        // {x, y, kind:"monster"/"chest"/"stairs"/"entrance"/"town", type}
  overworldState: null,
  player: null,
  combat: null,
  createStep: 0,
  createClassIdx: 0,
  createStats: null,
  tick: 0,
};

const CLASS_KEYS = Object.keys(CLASSES);

function newPlayer(classKey, stats) {
  const c = CLASSES[classKey];
  const conMod = mod(stats.con);
  return {
    cls: classKey,
    name: c.name,
    stats,
    level: 1,
    // 2x hit die + CON so level-1 heroes survive several hits instead of one
    hpMax: c.hd * 2 + conMod,
    hp: c.hd * 2 + conMod,
    xp: 0,
    xpNext: 300,
    ac: c.ac + (classKey === "rogue" ? mod(stats.dex) : 0),
    potions: 2,
    gold: 0,
    defending: false,
    spellUses: 3,
  };
}

// Standing spot in overworld column x: the passable (non-water) tile atop the
// first solid block, or null if the column is flooded or blocked.
function surfaceSpot(map, x) {
  for (let y = 1; y < MAP_H; y++) {
    if (SOLID[map[y][x]]) {
      const above = map[y - 1][x];
      return (above === T_WATER || SOLID[above]) ? null : [x, y - 1];
    }
  }
  return null;
}
function findOpenSpot(map, rnd) {
  for (let tries = 0; tries < 500; tries++) {
    const x = 2 + ((rnd() * (MAP_W - 4)) | 0);
    const spot = surfaceSpot(map, x);
    if (spot && map[spot[1]][spot[0]] === T_SKY) return spot;
  }
  return [MAP_W >> 1, MAP_H >> 1];
}

function enterOverworld() {
  if (G.overworldState) {
    const s = G.overworldState;
    G.map = s.map; G.entities = s.entities; G.px = s.px; G.py = s.py;
  } else {
    G.map = genOverworld(G.seed).map;
    const rnd = makeLCG(G.seed);
    G.entities = [];
    // town start
    const [tx, ty] = findOpenSpot(G.map, rnd);
    G.map[ty][tx] = T_TOWN;
    G.px = Math.min(MAP_W - 2, tx + 1); G.py = ty;
    // dungeon entrances spread across the world
    for (let i = 0; i < 3; i++) {
      const [dx, dy] = findOpenSpot(G.map, rnd);
      G.map[dy][dx] = T_CAVE;
      G.entities.push({ x: dx, y: dy, kind: "entrance", depth: i + 1 });
    }
    // roaming monsters
    const pool = ["goblin", "goblin", "wolf", "skeleton"];
    for (let i = 0; i < 12; i++) {
      const [mx, my] = findOpenSpot(G.map, rnd);
      if (mx === G.px && my === G.py) continue;
      G.entities.push({ x: mx, y: my, kind: "monster", type: pool[(rnd() * pool.length) | 0] });
    }
    // chests
    for (let i = 0; i < 4; i++) {
      const [cx2, cy2] = findOpenSpot(G.map, rnd);
      G.entities.push({ x: cx2, y: cy2, kind: "chest" });
    }
  }
  G.area = "overworld";
  G.dungeonLevel = 0;
  G.moveAnim = null;
  applyGravity();
}

function saveOverworld() {
  if (G.area === "overworld") {
    G.overworldState = { map: G.map, entities: G.entities, px: G.px, py: G.py };
  }
}

function enterDungeon(depth) {
  saveOverworld();
  const { map, standable } = genDungeon(G.seed, depth);
  G.map = map;
  G.area = "dungeon" + depth;
  G.dungeonLevel = depth;
  G.entities = [];
  const rnd = makeLCG(G.seed + depth * 777);
  // enter at the leftmost footing, exit stairs at the rightmost
  const start = standable[0];
  G.px = start[0]; G.py = start[1];
  G.moveAnim = null;
  const end = standable[standable.length - 1];
  G.entities.push({ x: end[0], y: end[1], kind: "stairs" });
  // monsters scale with depth
  const pools = [["goblin", "skeleton", "wolf"], ["skeleton", "orc", "wolf"], ["orc", "orc", "skeleton"]];
  const pool = pools[Math.min(depth - 1, 2)];
  const count = 6 + depth * 2;
  for (let i = 0; i < count; i++) {
    const [x, y] = standable[(rnd() * standable.length) | 0];
    if ((x === G.px && y === G.py) || (x === end[0] && y === end[1])) continue;
    G.entities.push({ x, y, kind: "monster", type: pool[(rnd() * pool.length) | 0] });
  }
  // boss dragon in deepest dungeon guarding the stairs vicinity
  if (depth === 3) {
    const [bx, by] = standable[standable.length - 2];
    G.entities.push({ x: bx, y: by, kind: "monster", type: "dragon" });
  }
  for (let i = 0; i < 2 + depth; i++) {
    const [x, y] = standable[(rnd() * standable.length) | 0];
    if (x === G.px && y === G.py) continue;
    G.entities.push({ x, y, kind: "chest" });
  }
  log(`You descend into Dungeon Level ${depth}...`, "sys");
}

// ---------- Combat ----------
function startCombat(monsterType, entRef) {
  const M = MONSTERS[monsterType];
  G.combat = {
    type: monsterType,
    name: M.name,
    hp: rollDice(M.hp[0], M.hp[1], M.hp[2]),
    hpMax: 0,
    ac: M.ac,
    atk: M.atk,
    dmg: M.dmg,
    xp: M.xp,
    boss: !!M.boss,
    entRef,
    turn: "player",
    flash: 0,
    playerFlash: 0,
  };
  G.combat.hpMax = G.combat.hp;
  G.mode = "combat";
  // Initiative
  const pInit = roll(20) + mod(G.player.stats.dex);
  const mInit = roll(20) + 1;
  log(`— ${M.name} attacks! —`, "sys");
  log(`Initiative: you ${pInit}, foe ${mInit}.`, "roll");
  G.combat.turn = pInit >= mInit ? "player" : "monster";
  if (G.combat.turn === "monster") setTimeout(monsterTurn, COMBAT_DELAY_MS);
}

function playerAttack(kind) {
  const cb = G.combat, p = G.player, c = CLASSES[p.cls];
  if (!cb || cb.turn !== "player") return;
  p.defending = false;

  if (kind === "defend") {
    p.defending = true;
    log("You raise your guard. (+4 AC until next turn)", "good");
    endPlayerTurn();
    return;
  }
  if (kind === "potion") {
    if (p.potions <= 0) { log("No potions left!", "dmg"); return; }
    p.potions--;
    const heal = rollDice(2, 4, 2);
    p.hp = Math.min(p.hpMax, p.hp + heal);
    log(`You drink a potion and heal ${heal} HP.`, "good");
    updateHUD();
    endPlayerTurn();
    return;
  }
  if (kind === "flee") {
    const r = roll(20) + mod(p.stats.dex);
    log(`Flee attempt: d20${fmtMod(mod(p.stats.dex))} = ${r} (DC 10)`, "roll");
    if (cb.boss) { log("You cannot flee from the dragon!", "dmg"); endPlayerTurn(); return; }
    if (r >= 10) {
      log("You escape!", "good");
      G.combat = null;
      G.mode = "explore";
      return;
    }
    log("You fail to escape!", "dmg");
    endPlayerTurn();
    return;
  }

  // attack / spell
  let atkMod, nD, dS, dB, label;
  if (kind === "spell") {
    if (p.cls !== "wizard" && p.cls !== "cleric") { log("You don't know any spells!", "dmg"); return; }
    if (p.spellUses <= 0) { log("Out of spell slots!", "dmg"); return; }
    p.spellUses--;
    if (p.cls === "wizard") { atkMod = mod(p.stats.int) + 2; nD = 2; dS = 8; dB = mod(p.stats.int); label = "Magic Missile barrage"; }
    else { atkMod = mod(p.stats.wis) + 2; nD = 2; dS = 6; dB = mod(p.stats.wis); label = "Sacred Flame"; }
  } else {
    const st = p.stats[c.atkStat];
    atkMod = mod(st) + 2; // proficiency
    nD = c.wDice[0]; dS = c.wDice[1]; dB = mod(st);
    label = c.weapon;
  }

  const d20 = roll(20);
  const total = d20 + atkMod;
  const crit = d20 === 20;
  log(`${label}: d20(${d20})${fmtMod(atkMod)} = ${total} vs AC ${cb.ac}`, "roll");
  if (d20 === 1) {
    log("Critical miss! You fumble.", "dmg");
  } else if (crit || total >= cb.ac) {
    let dmg = rollDice(crit ? nD * 2 : nD, dS, dB);
    if (p.cls === "rogue" && (crit || roll(20) > 12)) {
      const sneak = rollDice(1, 6);
      dmg += sneak;
      log(`Sneak attack! +${sneak} damage.`, "crit");
    }
    dmg = Math.max(1, dmg);
    cb.hp -= dmg;
    cb.flash = 8;
    log(crit ? `CRITICAL HIT! ${dmg} damage!` : `Hit! ${dmg} damage.`, crit ? "crit" : "good");
    if (cb.hp <= 0) { winCombat(); return; }
  } else {
    log("Miss!", "dmg");
  }
  endPlayerTurn();
}

function endPlayerTurn() {
  if (!G.combat) return;
  G.combat.turn = "monster";
  setTimeout(monsterTurn, COMBAT_DELAY_MS);
}

function monsterTurn() {
  const cb = G.combat, p = G.player;
  if (!cb) return;
  const effAC = p.ac + (p.defending ? 4 : 0);
  const d20 = roll(20);
  const total = d20 + cb.atk;
  log(`${cb.name} attacks: d20(${d20})+${cb.atk} = ${total} vs AC ${effAC}`, "roll");
  if (d20 !== 1 && (d20 === 20 || total >= effAC)) {
    let dmg = rollDice(d20 === 20 ? cb.dmg[0] * 2 : cb.dmg[0], cb.dmg[1], cb.dmg[2]);
    dmg = Math.max(1, dmg);
    p.hp -= dmg;
    cb.playerFlash = 8;
    log(d20 === 20 ? `CRITICAL! You take ${dmg} damage!` : `You take ${dmg} damage.`, "dmg");
    updateHUD();
    if (p.hp <= 0) {
      p.hp = 0;
      updateHUD();
      G.mode = "gameover";
      G.combat = null;
      log("You have fallen... Press Enter to try again.", "dmg");
      return;
    }
  } else {
    log(`${cb.name} misses!`, "good");
  }
  p.defending = false;
  cb.turn = "player";
}

function winCombat() {
  const cb = G.combat, p = G.player;
  log(`${cb.name} is slain! +${cb.xp} XP`, "crit");
  p.xp += cb.xp;
  const gold = rollDice(2, 6, cb.boss ? 50 : 0);
  p.gold += gold;
  log(`You loot ${gold} gold.`, "good");
  // remove entity from map
  const i = G.entities.indexOf(cb.entRef);
  if (i >= 0) G.entities.splice(i, 1);
  const wasBoss = cb.boss;
  G.combat = null;
  G.mode = "explore";
  while (p.xp >= p.xpNext) levelUp();
  updateHUD();
  if (wasBoss) {
    G.mode = "victory";
    log("The dragon falls! The realm is saved! Press Enter to play again.", "crit");
  }
}

function levelUp() {
  const p = G.player, c = CLASSES[p.cls];
  p.level++;
  p.xp -= p.xpNext;
  p.xpNext = Math.floor(p.xpNext * 1.7);
  const gain = Math.max(1, rollDice(1, c.hd, mod(p.stats.con)));
  p.hpMax += gain;
  p.hp = p.hpMax;
  p.spellUses = 3 + Math.floor(p.level / 2);
  log(`⬆ Level ${p.level}! Max HP +${gain}, fully healed.`, "crit");
}

// ---------- Exploration ----------
// ---------- Side-scrolling movement ----------
function solidAt(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return true;
  return !!SOLID[G.map[y][x]];
}
function supportedAt(x, y) { // standing on a block or floating on water
  return y >= MAP_H - 1 || supports(G.map[y + 1][x]);
}
// Fall until landing on a block or water surface. Returns tiles fallen.
function applyGravity() {
  let fell = 0;
  while (!supportedAt(G.px, G.py) && fell < MAP_H) { G.py++; fell++; }
  return fell;
}
// You can climb up when grounded (a hop) or holding onto an adjacent wall.
// Cavern walls are rough rock: inside dungeons you can always climb.
function canClimb() {
  return G.dungeonLevel > 0 || supportedAt(G.px, G.py) ||
         solidAt(G.px - 1, G.py) || solidAt(G.px + 1, G.py) ||
         solidAt(G.px - 1, G.py - 1) || solidAt(G.px + 1, G.py - 1);
}

function tryMove(dx, dy) {
  if (G.moveAnim) return; // still sliding to the previous tile
  if (dx) G.face = dx;
  let nx = G.px + dx, ny = G.py + dy;
  if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return;

  if (dy < 0) { // climb / hop up
    if (solidAt(nx, ny) || !canClimb()) return;
  } else if (dy > 0) { // climb down
    if (solidAt(nx, ny)) return;
  } else { // walk: auto-step up 1-tile ledges
    if (solidAt(nx, ny)) {
      if (!solidAt(nx, ny - 1) && !solidAt(G.px, G.py - 1)) ny--;
      else return;
    }
  }

  // check entities at target
  const ent = G.entities.find(e => e.x === nx && e.y === ny);
  if (ent) {
    if (ent.kind === "monster") { startCombat(ent.type, ent); return; }
    if (ent.kind === "chest") {
      openChest(ent);
      return;
    }
    if (ent.kind === "stairs") {
      // climb out of dungeon
      log("You climb the stairs back to the surface.", "sys");
      enterOverworld();
      updateHUD();
      return;
    }
  }

  const fx = G.px, fy = G.py;
  G.px = nx; G.py = ny;
  if (dy >= 0) applyGravity(); // climbing up isn't undone by gravity mid-ascent
  G.moveAnim = { fx, fy, t0: performance.now() };

  // landed on something interesting?
  const landEnt = G.entities.find(e => e.x === G.px && e.y === G.py);
  if (landEnt) {
    if (landEnt.kind === "monster") { startCombat(landEnt.type, landEnt); return; }
    if (landEnt.kind === "chest") openChest(landEnt);
  }
  const lt = G.map[G.py][G.px];

  if (lt === T_CAVE) { // dungeon entrance
    const e = G.entities.find(e2 => e2.kind === "entrance" && e2.x === G.px && e2.y === G.py);
    enterDungeon(e ? e.depth : 1);
    updateHUD();
    return;
  }
  if (lt === T_TOWN) { // town: rest
    const p = G.player;
    if (p.hp < p.hpMax || p.potions < 2) {
      p.hp = p.hpMax;
      p.spellUses = 3 + Math.floor(p.level / 2);
      if (p.gold >= POTION_COST && p.potions < MAX_POTIONS) { p.gold -= POTION_COST; p.potions++; log(`Bought a potion for ${POTION_COST} gold.`, "good"); }
      log("You rest at the inn. HP and spells restored.", "good");
      updateHUD();
    }
    return;
  }
  // random encounter in dungeons
  if (G.dungeonLevel > 0 && Math.random() < RANDOM_ENCOUNTER_CHANCE) {
    const pool = ["goblin", "skeleton", "wolf", "orc"];
    const type = pool[Math.min(pool.length - 1, (Math.random() * (2 + G.dungeonLevel)) | 0)];
    const wanderer = { x: G.px, y: G.py, kind: "monster", type };
    G.entities.push(wanderer);
    log("A monster ambushes you from the shadows!", "dmg");
    startCombat(type, wanderer);
  }
}

function openChest(ent) {
  const p = G.player;
  const r = roll(6);
  if (r <= 3) {
    const g = rollDice(3, 10, 10);
    p.gold += g;
    log(`Chest opened: ${g} gold!`, "good");
  } else if (r <= 5) {
    p.potions++;
    log("Chest opened: a healing potion!", "good");
  } else {
    p.hpMax += 2; p.hp += 2;
    log("Chest opened: an enchanted trinket! Max HP +2.", "crit");
  }
  const i = G.entities.indexOf(ent);
  if (i >= 0) G.entities.splice(i, 1);
  updateHUD();
}

// ---------- HUD ----------
function updateHUD() {
  const p = G.player;
  if (!p) return;
  document.getElementById("pname").textContent = `${p.name} — Lv ${p.level}`;
  document.getElementById("hptext").textContent = `${p.hp}/${p.hpMax}`;
  document.querySelector("#hpbar > div").style.width = (100 * p.hp / p.hpMax) + "%";
  document.getElementById("xptext").textContent = `${p.xp}/${p.xpNext}`;
  document.querySelector("#xpbar > div").style.width = (100 * p.xp / p.xpNext) + "%";
  const s = p.stats;
  document.getElementById("statline").innerHTML =
    `STR ${s.str} (${fmtMod(mod(s.str))}) &nbsp;DEX ${s.dex} (${fmtMod(mod(s.dex))}) &nbsp;CON ${s.con} (${fmtMod(mod(s.con))})<br>` +
    `INT ${s.int} (${fmtMod(mod(s.int))}) &nbsp;WIS ${s.wis} (${fmtMod(mod(s.wis))}) &nbsp;CHA ${s.cha} (${fmtMod(mod(s.cha))})<br>` +
    `AC ${p.ac} &nbsp;&middot;&nbsp; ${CLASSES[p.cls].weapon}`;
  document.getElementById("invline").innerHTML =
    `&#129380; Potions: ${p.potions} &nbsp;&#128176; Gold: ${p.gold}` +
    ((p.cls === "wizard" || p.cls === "cleric") ? ` &nbsp;&#10024; Spells: ${p.spellUses}` : "");
}

// ---------- Rendering ----------
function drawText(txt, x, y, size, color, align) {
  ctx.fillStyle = color || "#e8d8b0";
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textAlign = align || "left";
  ctx.fillText(txt, x, y);
  ctx.textAlign = "left";
}

function render() {
  G.tick++;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cv.width, cv.height);

  if (G.mode === "title") { renderTitle(); return; }
  if (G.mode === "create") { renderCreate(); return; }
  if (G.mode === "combat") { renderCombat(); return; }

  // explore / gameover / victory: draw world
  // Interpolate the player (and camera) between tiles for smooth movement.
  let ipx = G.px, ipy = G.py;
  if (G.moveAnim) {
    const e = (performance.now() - G.moveAnim.t0) / MOVE_MS;
    if (e >= 1) G.moveAnim = null;
    else {
      ipx = G.moveAnim.fx + (G.px - G.moveAnim.fx) * e;
      ipy = G.moveAnim.fy + (G.py - G.moveAnim.fy) * e;
    }
  }
  const half = VIEW >> 1;
  const camX = Math.max(0, Math.min(MAP_W - VIEW, ipx - half));
  const camY = Math.max(0, Math.min(MAP_H - VIEW, ipy - half));
  const cx0 = Math.floor(camX), cy0 = Math.floor(camY);
  const offX = Math.round((camX - cx0) * TILE), offY = Math.round((camY - cy0) * TILE);
  for (let vy = 0; vy <= VIEW; vy++) {
    for (let vx = 0; vx <= VIEW; vx++) {
      const wx = cx0 + vx, wy = cy0 + vy;
      if (wx >= MAP_W || wy >= MAP_H) continue;
      drawTile(G.map[wy][wx], vx * TILE - offX, vy * TILE - offY, wx, wy);
    }
  }
  for (const e of G.entities) {
    const vx = e.x - cx0, vy = e.y - cy0;
    if (vx < 0 || vy < 0 || vx > VIEW || vy > VIEW) continue;
    let spr = null;
    if (e.kind === "monster") spr = SPRITES[MONSTERS[e.type].spr];
    else if (e.kind === "chest") spr = SPRITES.chest;
    else if (e.kind === "stairs") spr = SPRITES.stairs;
    if (spr) {
      const ex = vx * TILE - offX, ey = vy * TILE - offY;
      if (e.kind !== "stairs") { // soft ground shadow
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(ex + 6, ey + 28, 20, 3);
      }
      ctx.drawImage(spr, ex, ey);
    }
  }
  // player with idle bob, facing the way they last walked
  const bob = (G.tick >> 4) % 2;
  const pxs = Math.round((ipx - camX) * TILE), pys = Math.round((ipy - camY) * TILE);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(pxs + 6, pys + 29, 20, 3);
  if (G.face < 0) {
    ctx.save();
    ctx.translate(pxs + TILE, pys - bob);
    ctx.scale(-1, 1);
    ctx.drawImage(SPRITES[G.player.cls], 0, 0);
    ctx.restore();
  } else {
    ctx.drawImage(SPRITES[G.player.cls], pxs, pys - bob);
  }

  // area label
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(4, 4, 180, 22);
  drawText(G.dungeonLevel > 0 ? `Dungeon — Level ${G.dungeonLevel}` : "Overworld", 10, 20, 13, "#f0c060");

  if (G.mode === "gameover") overlay("YOU DIED", "#e05050", "Press Enter to rise again");
  if (G.mode === "victory") overlay("VICTORY!", "#ffd700", "The dragon is slain! Enter to replay");
}

function overlay(title, color, sub) {
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, cv.width, cv.height);
  drawText(title, cv.width / 2, 220, 42, color, "center");
  drawText(sub, cv.width / 2, 260, 15, "#e8d8b0", "center");
}

function renderTitle() {
  ctx.fillStyle = "#100a18";
  ctx.fillRect(0, 0, cv.width, cv.height);
  // starfield
  for (let i = 0; i < 40; i++) {
    const n1 = hashNoise(i, 7, 3), n2 = hashNoise(i, 13, 5);
    ctx.fillStyle = (i + (G.tick >> 5)) % 5 ? "#544a6a" : "#a89ac8";
    ctx.fillRect((n1 * 476) | 0, (n2 * 300) | 0, 3, 3);
  }
  ctx.drawImage(SPRITES.dragon, 160, 60, 160, 160);
  drawText("PIXELFUNZ", cv.width / 2, 280, 44, "#f0c060", "center");
  drawText("A D&D-Style Pixel Adventure", cv.width / 2, 312, 16, "#b09fd0", "center");
  if ((G.tick >> 4) % 2) drawText("— Press Enter to begin —", cv.width / 2, 380, 18, "#e8d8b0", "center");
  drawText("Slay the dragon in Dungeon 3 to win!", cv.width / 2, 430, 13, "#a08868", "center");
}

function renderCreate() {
  ctx.fillStyle = "#100a18";
  ctx.fillRect(0, 0, cv.width, cv.height);
  drawText("CREATE YOUR HERO", cv.width / 2, 50, 24, "#f0c060", "center");

  if (G.createStep === 0) {
    drawText("Choose a class (←/→, Enter):", cv.width / 2, 90, 15, "#e8d8b0", "center");
    CLASS_KEYS.forEach((k, i) => {
      const x = 40 + i * 105;
      const sel = i === G.createClassIdx;
      if (sel) {
        ctx.strokeStyle = "#f0c060";
        ctx.lineWidth = 3;
        ctx.strokeRect(x - 8, 110, 96, 130);
      }
      ctx.drawImage(SPRITES[k], x + 8, 120, 64, 64);
      drawText(CLASSES[k].name, x + 40, 205, 14, sel ? "#f0c060" : "#a08868", "center");
      drawText("d" + CLASSES[k].hd + " HD", x + 40, 224, 11, "#8fd0ff", "center");
    });
    const c = CLASSES[CLASS_KEYS[G.createClassIdx]];
    drawText(`Weapon: ${c.weapon}  ·  AC ${c.ac}`, cv.width / 2, 280, 14, "#9fe89f", "center");
    drawText(`Primary: ${c.prime.map(s => s.toUpperCase()).join(" & ")}`, cv.width / 2, 305, 14, "#9fe89f", "center");
  } else {
    const s = G.createStats;
    drawText("Ability Scores (4d6 drop lowest)", cv.width / 2, 95, 15, "#e8d8b0", "center");
    const names = ["str", "dex", "con", "int", "wis", "cha"];
    names.forEach((n, i) => {
      const y = 140 + i * 34;
      drawText(n.toUpperCase(), 150, y, 18, "#f0c060");
      drawText(String(s[n]).padStart(2), 240, y, 18, "#e8d8b0");
      drawText("(" + fmtMod(mod(s[n])) + ")", 290, y, 15, "#8fd0ff");
    });
    drawText("R: reroll   ·   Enter: begin adventure", cv.width / 2, 390, 15, "#9fe89f", "center");
  }
}

function renderCombat() {
  const cb = G.combat, p = G.player;
  // backdrop
  const dun = G.dungeonLevel > 0;
  const grd = ctx.createLinearGradient(0, 0, 0, cv.height);
  grd.addColorStop(0, dun ? "#181020" : "#284a70");
  grd.addColorStop(1, dun ? "#2a1c30" : "#2f7a38");
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = dun ? "#241a2e" : "#256b34";
  ctx.fillRect(0, 330, cv.width, 150);

  // monster
  const mFlash = cb.flash > 0;
  if (cb.flash > 0) cb.flash--;
  const mBob = Math.sin(G.tick / 12) * 4;
  if (!mFlash || G.tick % 4 < 2) {
    ctx.drawImage(SPRITES[MONSTERS[cb.type].spr], 280, 130 + mBob, cb.boss ? 160 : 128, cb.boss ? 160 : 128);
  }
  // player (back view = just sprite, flipped position)
  const pFlash = cb.playerFlash > 0;
  if (cb.playerFlash > 0) cb.playerFlash--;
  if (!pFlash || G.tick % 4 < 2) {
    ctx.drawImage(SPRITES[p.cls], 70, 250, 96, 96);
  }

  // monster HP plate
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(260, 60, 200, 50);
  drawText(cb.name, 270, 80, 15, cb.boss ? "#ffd700" : "#e8d8b0");
  ctx.fillStyle = "#402030"; ctx.fillRect(270, 90, 180, 10);
  ctx.fillStyle = "#e05050"; ctx.fillRect(270, 90, 180 * Math.max(0, cb.hp) / cb.hpMax, 10);

  // action menu
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(10, 360, 460, 110);
  ctx.strokeStyle = "#6b4a2a"; ctx.lineWidth = 2;
  ctx.strokeRect(10, 360, 460, 110);
  if (cb.turn === "player") {
    const canSpell = p.cls === "wizard" || p.cls === "cleric";
    drawText("Your turn:", 24, 384, 14, "#f0c060");
    drawText(`1) Attack (${CLASSES[p.cls].weapon})`, 24, 408, 14);
    drawText(canSpell ? `2) Cast Spell [${p.spellUses}]` : "2) —", 24, 430, 14, canSpell ? "#e8d8b0" : "#555");
    drawText("3) Defend", 24, 452, 14);
    drawText(`4) Flee    H) Potion [${p.potions}]`, 250, 452, 14);
  } else {
    drawText(`${cb.name} is acting...`, 24, 408, 15, "#ff8f8f");
  }
}

// ---------- Input ----------
function startCreation() {
  G.mode = "create";
  G.createStep = 0;
  G.createClassIdx = 0;
}
function rollStats() {
  return {
    str: roll4d6DropLowest(), dex: roll4d6DropLowest(), con: roll4d6DropLowest(),
    int: roll4d6DropLowest(), wis: roll4d6DropLowest(), cha: roll4d6DropLowest(),
  };
}
function beginAdventure() {
  G.player = newPlayer(CLASS_KEYS[G.createClassIdx], G.createStats);
  G.seed = (Math.random() * 100000) | 0;
  G.overworldState = null;
  enterOverworld();
  G.mode = "explore";
  logEl.innerHTML = "";
  log(`Welcome, ${G.player.name}! Find the cave entrances and slay the dragon in Dungeon 3.`, "sys");
  log("Return to the town house to rest and buy potions.", "sys");
  updateHUD();
}

function handleInput(k) {
  if (G.mode === "title") {
    if (k === "Enter") startCreation();
    return;
  }
  if (G.mode === "create") {
    if (G.createStep === 0) {
      if (k === "ArrowLeft" || k === "a") G.createClassIdx = (G.createClassIdx - 1 + CLASS_KEYS.length) % CLASS_KEYS.length;
      if (k === "ArrowRight" || k === "d") G.createClassIdx = (G.createClassIdx + 1) % CLASS_KEYS.length;
      if (k === "Enter") { G.createStats = rollStats(); G.createStep = 1; }
    } else {
      if (k === "r" || k === "R") G.createStats = rollStats();
      if (k === "Enter") beginAdventure();
    }
    return;
  }
  if (G.mode === "gameover" || G.mode === "victory") {
    if (k === "Enter") { G.mode = "title"; }
    return;
  }
  if (G.mode === "combat") {
    if (k === "1") playerAttack("attack");
    if (k === "2") playerAttack("spell");
    if (k === "3") playerAttack("defend");
    if (k === "4") playerAttack("flee");
    if (k === "h" || k === "H") playerAttack("potion");
    return;
  }
  if (G.mode === "explore") {
    if (k === "ArrowUp" || k === "w") tryMove(0, -1);
    else if (k === "ArrowDown" || k === "s") tryMove(0, 1);
    else if (k === "ArrowLeft" || k === "a") tryMove(-1, 0);
    else if (k === "ArrowRight" || k === "d") tryMove(1, 0);
    else if (k === "h" || k === "H") {
      const p = G.player;
      if (p.potions > 0 && p.hp < p.hpMax) {
        p.potions--;
        const heal = rollDice(2, 4, 2);
        p.hp = Math.min(p.hpMax, p.hp + heal);
        log(`You drink a potion and heal ${heal} HP.`, "good");
        updateHUD();
      }
    }
  }
}

document.addEventListener("keydown", (ev) => {
  const k = ev.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) ev.preventDefault();
  handleInput(k);
});

// Touch controls: buttons dispatch the same keys the keyboard handler uses.
document.querySelectorAll("#touch-controls button").forEach((btn) => {
  btn.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    handleInput(btn.dataset.key);
  });
});

cv.focus();
cv.addEventListener("click", () => cv.focus());

// Fit the canvas to the screen. CSS-only scaling (max-width: 100%) yields
// non-integer scale factors on phones, which makes pixelated rendering look
// rough and uneven. Instead, snap the displayed size so every canvas pixel
// maps to a whole number of device pixels; when integer snapping would waste
// too much screen (or the screen is smaller than 1:1 device pixels), fall
// back to smooth downscaling, which looks far better than rough pixelation.
const CRISP_THRESHOLD = 0.8; // only snap to integer scaling if it keeps >=80% of the available width
function fitCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const cvStyle = getComputedStyle(cv), bodyStyle = getComputedStyle(document.body);
  const border = parseFloat(cvStyle.borderLeftWidth) + parseFloat(cvStyle.borderRightWidth);
  const bodyPad = parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
  const avail = Math.min(cv.width, document.documentElement.clientWidth - bodyPad - border);
  const devicePx = Math.floor((avail * dpr) / cv.width) * cv.width;
  const crispCss = devicePx / dpr;
  if (devicePx >= cv.width && crispCss >= CRISP_THRESHOLD * avail) {
    cv.style.width = crispCss + "px";
    cv.style.height = crispCss + "px";
    cv.style.imageRendering = "pixelated";
  } else {
    cv.style.width = avail + "px";
    cv.style.height = avail + "px";
    cv.style.imageRendering = "auto";
  }
}
window.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", fitCanvas);
fitCanvas();

(function loop() {
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
